name: Test metadata export

on:
  push:
    branches: [main]
    paths:
      - 'Scripts/pressmint2meta.xsl'
      - 'Scripts/pressmint-lib.xsl'
      - 'Scripts/tests/**'
      - '.github/workflows/test-metadata-export.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Scripts/pressmint2meta.xsl'
      - 'Scripts/pressmint-lib.xsl'
      - 'Scripts/tests/**'
      - '.github/workflows/test-metadata-export.yml'

permissions:
  contents: read

jobs:
  metadata-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install saxonche==13.0.0
      - run: python -m unittest discover -s Scripts/tests -v
